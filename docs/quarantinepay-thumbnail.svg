<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">QuarantinePay: verify before settlement</title>
  <desc id="desc">A white-background diagram showing a signed buyer intent, sandbox authorization and quarantined delivery, then verified capture or failed-delivery void.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <circle cx="1130" cy="-70" r="250" fill="#ecfdf5"/>
  <circle cx="1240" cy="60" r="145" fill="#d1fae5" opacity=".56"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
    <rect x="72" y="64" width="50" height="50" rx="15" fill="url(#accent)"/>
    <path d="M98 75a15 15 0 1 0 0 30h8l-6-7h-2a8 8 0 1 1 8-8v8h7V90a15 15 0 0 0-15-15Z" fill="#fff"/>
    <text x="138" y="97" fill="#0f172a" font-size="22" font-weight="750" letter-spacing="-.4">QuarantinePay</text>
    <rect x="900" y="73" width="276" height="34" rx="17" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="922" cy="90" r="5" fill="#059669"/>
    <text x="938" y="96" fill="#047857" font-size="13" font-weight="750" letter-spacing="1.1">VERIFIED PAYMENT FLOW</text>

    <text x="72" y="218" fill="#0f172a" font-size="63" font-weight="780" letter-spacing="-2.8">Verify the delivery.</text>
    <text x="72" y="290" fill="#0f172a" font-size="63" font-weight="780" letter-spacing="-2.8">Then <tspan fill="#059669">settle.</tspan></text>
    <text x="74" y="333" fill="#475569" font-size="21">A buyer-bound intent. A quarantine window. A confirmed outcome.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="386" width="347" height="196" rx="22" fill="#fff" stroke="#e2e8f0"/>
      <rect x="466" y="386" width="347" height="196" rx="22" fill="#fff" stroke="#e2e8f0"/>
      <rect x="860" y="386" width="347" height="196" rx="22" fill="#fff" stroke="#e2e8f0"/>
    </g>
    <path d="M427 484h24m-8-8 8 8-8 8M821 484h24m-8-8 8 8-8 8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="113" cy="430" r="20" fill="#ecfdf5"/><text x="113" y="436" text-anchor="middle" fill="#047857" font-size="15" font-weight="800">01</text>
    <text x="146" y="437" fill="#0f172a" font-size="19" font-weight="720">Buyer-bound intent</text>
    <text x="100" y="487" fill="#475569" font-size="15">Merchant, amount and currency</text>
    <text x="100" y="511" fill="#475569" font-size="15">are locked before the agent acts.</text>
    <rect x="100" y="539" width="139" height="25" rx="12.5" fill="#f1f5f9"/><text x="114" y="556" fill="#334155" font-size="12" font-weight="700">ED25519 SIGNATURE</text>

    <circle cx="507" cy="430" r="20" fill="#ecfdf5"/><text x="507" y="436" text-anchor="middle" fill="#047857" font-size="15" font-weight="800">02</text>
    <text x="540" y="437" fill="#0f172a" font-size="19" font-weight="720">Authorize &amp; quarantine</text>
    <text x="494" y="487" fill="#475569" font-size="15">Sandbox hold while the signed</text>
    <text x="494" y="511" fill="#475569" font-size="15">invoice acceptance check runs.</text>
    <rect x="494" y="539" width="163" height="25" rx="12.5" fill="#fffbeb"/><text x="508" y="556" fill="#92400e" font-size="12" font-weight="700">BUYER-APPROVED HOLD</text>

    <circle cx="901" cy="430" r="20" fill="#ecfdf5"/><text x="901" y="436" text-anchor="middle" fill="#047857" font-size="15" font-weight="800">03</text>
    <text x="934" y="437" fill="#0f172a" font-size="19" font-weight="720">Verify before settlement</text>
    <text x="888" y="487" fill="#475569" font-size="15">The worker follows the verifier:</text>
    <rect x="888" y="516" width="142" height="34" rx="10" fill="#ecfdf5"/><circle cx="905" cy="533" r="5" fill="#059669"/><text x="917" y="538" fill="#047857" font-size="13" font-weight="750">PASS · CAPTURE</text>
    <rect x="1040" y="516" width="128" height="34" rx="10" fill="#fff1f2"/><circle cx="1057" cy="533" r="5" fill="#e11d48"/><text x="1069" y="538" fill="#be123c" font-size="13" font-weight="750">FAIL · VOID</text>

    <line x1="72" y1="626" x2="1208" y2="626" stroke="#e2e8f0"/>
    <text x="72" y="663" fill="#64748b" font-size="14" font-weight="650" letter-spacing=".7">LOCAL GPU AI</text>
    <circle cx="204" cy="658" r="3" fill="#cbd5e1"/>
    <text x="222" y="663" fill="#64748b" font-size="14" font-weight="650" letter-spacing=".7">DETERMINISTIC DELIVERY CHECK</text>
    <circle cx="501" cy="658" r="3" fill="#cbd5e1"/>
    <text x="523" y="663" fill="#64748b" font-size="14" font-weight="650" letter-spacing=".7">PAYPAL SANDBOX</text>
    <text x="1208" y="663" text-anchor="end" fill="#94a3b8" font-size="13">No real funds · not escrow</text>
  </g>
</svg>
